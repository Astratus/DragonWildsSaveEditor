[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dragonwilds-save-editor"
dynamic = ["version"]
description = "Unofficial save editor for RuneScape: Dragonwilds (character and world saves)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# Standard library only (tkinter for the GUI): no runtime dependencies.
dependencies = []
keywords = ["dragonwilds", "runescape", "save-editor", "tkinter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/Astratus/DragonWildsSaveEditor"
Issues = "https://github.com/Astratus/DragonWildsSaveEditor/issues"
Changelog = "https://github.com/Astratus/DragonWildsSaveEditor/blob/main/CHANGELOG.md"

[project.gui-scripts]
dragonwilds-save-editor = "dragonwilds_save_editor.__main__:main"

[project.scripts]
dwsave = "dragonwilds_save_editor.save:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["dragonwilds_save_editor*"]

[tool.setuptools.package-data]
# Bundled data: skills, XP table, questline, map and lodestone data, and the item catalog
# (data/catalog/, generated by packaging/build_catalog.py from an installed game) and the
# gamedata reader's class schemas (data/gamedata/schemas.json).
dragonwilds_save_editor = ["data/*.json", "data/catalog/*.json", "data/gamedata/*.json"]

[tool.setuptools.dynamic]
# Single source of truth for the version: dragonwilds_save_editor/__init__.py.
version = { attr = "dragonwilds_save_editor.__version__" }
